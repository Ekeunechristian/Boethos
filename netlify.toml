# Boēthos on Netlify: build with `npm run build`, serve the dist folder.
[build]
  command = "npm run build"
  publish = "dist"

# The service worker and the page must never be cached, so every update reaches the phone.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
